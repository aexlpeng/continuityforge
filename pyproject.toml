[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "continuityforge"
version = "0.1.0"
description = "Open-source orchestration and evaluation for coherent multi-shot AI animation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "ContinuityForge contributors" }]
keywords = ["generative-video", "animation", "storytelling", "fal", "evaluation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Video",
]
dependencies = ["PyYAML>=6.0,<7"]

[project.optional-dependencies]
fal = ["fal-client>=0.7"]
dev = ["pytest>=8,<9", "ruff>=0.8,<1"]

[project.scripts]
continuityforge = "continuityforge.cli:main"

[project.urls]
Homepage = "https://github.com/aexlpeng/continuityforge"
Repository = "https://github.com/aexlpeng/continuityforge"
Issues = "https://github.com/aexlpeng/continuityforge/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/continuityforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
