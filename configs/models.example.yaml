# Illustrative routing configuration, not a promise of endpoint availability.
# Before live use, choose models in https://fal.ai/models and copy the exact
# endpoint ID and input schema shown on each model's current API page.
models:
  - id: primary-i2v
    endpoint: replace-with-current-fal-image-to-video-endpoint
    tasks: [image-to-video]
    durations: [5, 10]
    priority: 10
    estimated_cost_per_second_usd: null
    arguments:
      prompt: "{prompt}"
      negative_prompt: "{negative_prompt}"
      duration: "{duration_seconds}"
      # Add the endpoint's required image/reference field here.

  - id: fallback-t2v
    endpoint: replace-with-current-fal-text-to-video-endpoint
    tasks: [text-to-video]
    durations: [5, 10]
    priority: 20
    estimated_cost_per_second_usd: null
    arguments:
      prompt: "{prompt}"
      duration: "{duration_seconds}"

